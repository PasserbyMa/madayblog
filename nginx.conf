events {}

http {
    # --------------------------
    # Logging (Docker stdout)
    # --------------------------
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'RT=$request_time';

    access_log /dev/stdout custom_log;
    access_log /var/log/nginx/access.log custom_log;  # Logstash가 읽을 파일
    error_log /dev/stderr warn;

    # --------------------------
    # Upstream (Next.js)
    # --------------------------
    upstream nextjs_upstream {
        server mablog_nextjs:8080;
    }
    upstream javablog_upstream {
        server javablog_app:8080;
    }
    upstream javablog_v3_upstream {
        server javablog_v3_app:8080;
    }
    # --------------------------
    # HTTP → HTTPS
    # --------------------------
    server {
        listen 80;
        server_name madayblog.com www.madayblog.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------
    # HTTPS
    # --------------------------
    server {
        listen 443 ssl http2;
        server_name madayblog.com www.madayblog.com;

        ssl_certificate /etc/letsencrypt/live/madayblog.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/madayblog.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # ACME challenge (renew 안정성)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # --------------------------
        # Main proxy
        # --------------------------
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --------------------------
        # madayV2 (Spring Boot + Oracle)
        # --------------------------
        location = /v2 {
            return 301 https://$host/v2/;
        }
        location /v2/ {
            proxy_pass http://javablog_upstream/v2/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --------------------------
        # madayV3 (Spring Boot + MySQL)
        # --------------------------
        location = /v3 {
            return 301 https://$host/v3/;
        }
        location /v3/ {
            proxy_pass http://javablog_v3_upstream/v3/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --------------------------
        # API proxy
        # --------------------------
        location /api {
            proxy_pass http://nextjs_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 180s;   # AI 요약 등 긴 작업 대비 (기본 60s → 180s)
            proxy_send_timeout 180s;
        }
    }

    server {
    listen 80;
    server_name 129.154.55.20;

    location / {
        proxy_pass http://javablog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
}
