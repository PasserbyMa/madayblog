# ============================================================
# INPUT: nginx access.log 파일을 읽음
# ============================================================
input {
    file {
        path => "/var/log/nginx/access.log"
        start_position => "beginning"   # 기존 로그도 처음부터 읽음
        sincedb_path => "/dev/null"  # 재시작마다 처음부터 읽음 (개발용)
        tags => ["nginx"]
    }
}

# ============================================================
# FILTER: 텍스트 한 줄을 구조화된 데이터로 파싱
#
# 입력: '172.0.0.1 - - [05/Apr/2026:23:14:29 +0000] "GET /favicon HTTP/2.0" 200 2238 "-" "Mozilla/5.0" RT=0.011'
# 출력: { client_ip: "172.0.0.1", method: "GET", path: "/favicon", status: 200, ... }
# ============================================================
filter {
    # grok: 정규식 패턴으로 텍스트를 필드로 분해
    grok {
        match => {
            "message" => "%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:log_timestamp}\] \"%{WORD:method} %{DATA:path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status:int} %{NUMBER:bytes:int} \"%{DATA:referer}\" \"%{DATA:user_agent}\" RT=%{NUMBER:response_time:float}"
        }
    }

    # grok 실패한 줄(빈 줄, 헬스체크 등)은 버림
    if "_grokparsefailure" in [tags] {
        drop {}
    }

    # log_timestamp → @timestamp (ES 표준 시간 필드)
    date {
        match => ["log_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
    }

    # 상태 코드 분류 (Kibana에서 색상 구분용)
    if [status] >= 500 {
        mutate { add_field => { "status_category" => "server_error" } }
    } else if [status] >= 400 {
        mutate { add_field => { "status_category" => "client_error" } }
    } else if [status] >= 300 {
        mutate { add_field => { "status_category" => "redirect" } }
    } else {
        mutate { add_field => { "status_category" => "success" } }
    }

    # 불필요한 원본 필드 제거
    mutate {
        remove_field => ["message", "log_timestamp", "event", "log"]
    }
}

# ============================================================
# OUTPUT: 파싱된 데이터를 Kafka와 Elasticsearch에 동시 전송
# ============================================================
output {
    # Kafka: "nginx-logs" topic에 push (버퍼/이벤트 스트림 역할)
    kafka {
        bootstrap_servers => "mablog_kafka:9092"
        topic_id => "nginx-logs"
        codec => "json"
    }

    # Elasticsearch: 날짜별 인덱스로 저장 (nginx-logs-2026.04.06 형태)
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "nginx-logs-%{+YYYY.MM.dd}"
    }
}
