services:
    # --------------------------
    # MongoDB
    # --------------------------
    db:
        image: mongo:7.0
        container_name: mablog_mongodb
        restart: always
        # MCP 연동을 위해 localhost에만 포트 노출 (외부 접근 불가)
        ports:
            - "127.0.0.1:27017:27017"
        # ports 추가 전 원본 (포트 노출 없음):
        # (ports 항목 없음 — Docker 내부 네트워크에서만 접근 가능)
        volumes:
            - ./mongo_data:/data/db
            - ./backup:/tmp/backup
        environment:
            MONGO_INITDB_ROOT_USERNAME: mongoAdmin
            MONGO_INITDB_ROOT_PASSWORD: mongoA96547852!
            MONGO_INITDB_DATABASE: maBlog_DataTable
        networks:
            - mablog_network

    # --------------------------
    # Next.js
    # --------------------------
    mablog_nextjs:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: mablog_nextjs
        restart: always
        expose:
            - '8080'
        env_file:
            - ./.env.production
        environment:
            - HOST=0.0.0.0
            - PORT=8080
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /opt/ma_blog/read_os:/opt/ma_blog/read_os
        depends_on:
            - db
        networks:
            - mablog_network

    # --------------------------
    # Nginx Reverse Proxy
    # --------------------------
    mablog_proxy:
        image: nginx:stable-alpine
        container_name: mablog_proxy
        restart: always
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
            - ./nginx_logs:/var/log/nginx   # Logstash가 읽을 로그 파일 공유
        depends_on:
            - mablog_nextjs
        networks:
            - mablog_network

    # --------------------------
    # Certbot (자동 갱신 전용)
    # --------------------------
    certbot:
        image: certbot/certbot
        container_name: certbot
        restart: unless-stopped
        volumes:
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
        entrypoint: >
            sh -c "trap exit TERM;
            while :; do
              certbot renew
                --webroot -w /var/www/certbot
                --non-interactive
                --quiet;
              sleep 12h;
            done"
        networks:
            - mablog_network

    # --------------------------
    # Kafka (KRaft 모드: Zookeeper 없이 단독 실행)
    # KRaft = Kafka Raft → Kafka 자체가 메타데이터 관리
    # --------------------------
    mablog_kafka:
        image: apache/kafka:3.7.0
        container_name: mablog_kafka
        restart: always
        environment:
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller           # 브로커 + 컨트롤러 겸임
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@mablog_kafka:9093
            - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://mablog_kafka:9092
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true            # topic 자동 생성
            - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m               # JVM 힙 제한 (메모리 절약)
            - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk              # KRaft 클러스터 고정 ID
        networks:
            - mablog_network

    # --------------------------
    # Elasticsearch (로그 저장/검색 엔진)
    # --------------------------
    mablog_elasticsearch:
        image: elasticsearch:8.13.4
        container_name: mablog_elasticsearch
        restart: always
        environment:
            - discovery.type=single-node          # 단일 노드 모드 (클러스터 불필요)
            - xpack.security.enabled=false        # 내부망이므로 인증 비활성화
            - ES_JAVA_OPTS=-Xms512m -Xmx512m      # JVM 힙 제한
        volumes:
            - ./elasticsearch_data:/usr/share/elasticsearch/data
        networks:
            mablog_network:
                aliases:
                    - elasticsearch  # 언더스코어 없는 alias (Logstash URI 파싱 호환)

    # --------------------------
    # Logstash (수집/파싱/전송 파이프라인)
    # nginx 로그 → grok 파싱 → Kafka + Elasticsearch
    # --------------------------
    mablog_logstash:
        image: logstash:8.13.4
        container_name: mablog_logstash
        restart: always
        volumes:
            - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro  # 기본 설정
            - ./logstash/pipeline:/usr/share/logstash/pipeline:ro                 # 파이프라인 설정
            - ./nginx_logs:/var/log/nginx:ro                                       # nginx 로그 읽기 전용
        environment:
            - LS_JAVA_OPTS=-Xms256m -Xmx256m
        depends_on:
            - mablog_kafka
            - mablog_elasticsearch
        networks:
            - mablog_network

    # --------------------------
    # Kibana (Elasticsearch 시각화 UI)
    # 접근: ssh -L 5601:localhost:5601 ubuntu@서버IP → http://localhost:5601
    # --------------------------
    mablog_kibana:
        image: kibana:8.13.4
        container_name: mablog_kibana
        restart: always
        ports:
            - "127.0.0.1:5601:5601"   # 로컬호스트만 (외부 직접 접근 차단)
        environment:
            - ELASTICSEARCH_HOSTS=http://mablog_elasticsearch:9200
        depends_on:
            - mablog_elasticsearch
        networks:
            - mablog_network

    # --------------------------
    # Ollama (로컬 AI 모델 서버)
    # 접근: http://mablog_ollama:11434 (내부), http://localhost:11434 (로컬)
    # --------------------------
    mablog_ollama:
        image: ollama/ollama:latest
        container_name: mablog_ollama
        restart: always
        ports:
            - "127.0.0.1:11434:11434"   # 로컬호스트만 (외부 직접 접근 차단)
        volumes:
            - ./ollama_data:/root/.ollama   # 모델 파일 영속성
        networks:
            - mablog_network

networks:
    mablog_network:
        driver: bridge
